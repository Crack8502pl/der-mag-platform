services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dermag_platform}
      POSTGRES_USER: ${DB_USER:-dermag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: der-mag-platform:local
    restart: "no"
    env_file: .env
    environment: &backend_environment
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dermag_platform}
      DB_USER: ${DB_USER:-dermag_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SYMFONIA_SYNC_ENABLED: ${SYMFONIA_SYNC_ENABLED:-false}
    command: ["node", "dist/scripts/migrate-and-seed.js"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: der-mag-platform:local
    restart: unless-stopped
    env_file: .env
    environment: *backend_environment
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - app_uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      NGINX_ENVSUBST_FILTER: '^(DOMAIN)$'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy

  proxy-lan:
    build:
      context: .
      dockerfile: docker/https-lan/Dockerfile
    restart: unless-stopped
    profiles: ["https-lan"]
    environment:
      SERVER_HOST: ${SERVER_HOST:-192.168.2.38}
      NGINX_ENVSUBST_FILTER: '^(SERVER_HOST)$'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/lan.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/https-lan/generate-cert.sh:/usr/local/bin/generate-cert.sh:ro
      - lan_certs:/etc/nginx/certs
    command: ["sh", "-c", "sh /usr/local/bin/generate-cert.sh && nginx -g 'daemon off;'"]
    depends_on:
      app:
        condition: service_healthy

  certbot:
    image: certbot/certbot:v4.2.0
    profiles: ["certbot"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    ports:
      - "80:80"
    volumes:
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt
    entrypoint: ["certbot"]
    command: ["--version"]

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-dermag_platform}
      PGUSER: ${DB_USER:-dermag_user}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: UTC
    command: ["bash", "/usr/local/bin/backup.sh", "schedule"]
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/backup/restore.sh:/usr/local/bin/restore.sh:ro
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  db_backups:
  lan_certs:
