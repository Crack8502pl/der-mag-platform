name: Docker Compose Integration

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'docker/**'
      - 'backend/src/config/database.ts'
      - 'backend/src/migrations/**'
      - 'backend/src/scripts/**'
      - 'backend/src/services/DatabaseSeeder.ts'
      - 'backend/scripts/**'
      - '.github/workflows/docker-compose-integration.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'docker/**'
      - 'backend/src/config/database.ts'
      - 'backend/src/migrations/**'
      - 'backend/src/scripts/**'
      - 'backend/src/services/DatabaseSeeder.ts'
      - 'backend/scripts/**'
      - '.github/workflows/docker-compose-integration.yml'

permissions:
  contents: read

jobs:
  compose-clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure test environment
        run: |
          printf '%s\n' \
            'DB_NAME=dermag_compose_test' \
            'DB_USER=dermag_user' \
            'DB_PASSWORD=compose-test-db-password' \
            'REDIS_PASSWORD=compose-test-redis-password' \
            'JWT_ACCESS_SECRET=compose-test-access-secret-at-least-32-chars' \
            'JWT_REFRESH_SECRET=compose-test-refresh-secret-at-least-32-chars' \
            'ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' \
            'APP_PORT=3000' \
            'APP_BIND_ADDRESS=127.0.0.1' \
            'CORS_ORIGIN=http://localhost:3000' \
            'DOMAIN=example.test' \
            'CERTBOT_EMAIL=ci@example.test' \
            'LETSENCRYPT_DIR=/tmp/letsencrypt' \
            'SYMFONIA_SYNC_ENABLED=false' > .env

      - name: Create temporary TLS certificate for proxy integration test
        run: |
          mkdir -p /tmp/letsencrypt/live/example.test
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /tmp/letsencrypt/live/example.test/privkey.pem \
            -out /tmp/letsencrypt/live/example.test/fullchain.pem \
            -subj '/CN=example.test' \
            -addext 'subjectAltName=DNS:example.test'

      - name: Start clean Compose stack
        run: |
          docker compose --profile https down --volumes --remove-orphans
          docker compose --profile https up --build --detach --wait --wait-timeout 240

      - name: Verify seeded admin login
        run: |
          status=$(curl --silent --show-error --output /tmp/login-response \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"username":"admin","password":"Admin123!"}' \
            http://localhost:3000/api/auth/login)
          if [ "$status" != "200" ]; then
            cat /tmp/login-response
            echo "Expected admin login to return HTTP 200, got $status"
            exit 1
          fi
          node -e "const response = JSON.parse(require('fs').readFileSync('/tmp/login-response', 'utf8')); if (!response.success || response.data.user.username !== 'admin' || !response.data.requirePasswordChange) process.exit(1)"

      - name: Verify HTTPS reverse proxy
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --noproxy '*' --resolve example.test:80:127.0.0.1 http://example.test/api/health)
          test "$status" = "301"
          curl --fail --silent --show-error --noproxy '*' --resolve example.test:443:127.0.0.1 \
            --insecure https://example.test/api/health

      - name: Verify PostgreSQL backup
        run: |
          docker compose run --rm backup bash /usr/local/bin/backup.sh once
          docker compose run --rm --entrypoint bash backup -c \
            'gzip -t /backups/grover_backup_*.sql.gz && test -n "$(ls /backups/grover_backup_*.sql.gz)"'

      - name: Verify PostgreSQL restore
        run: |
          backup_file=$(docker compose exec -T backup bash -c 'ls -1t /backups/grover_backup_*.sql.gz | head -n 1')
          docker compose stop app
          printf 'RESTORE\n' | docker compose run --rm -T backup \
            bash /usr/local/bin/restore.sh "$backup_file"
          docker compose up --detach --wait --wait-timeout 60 app
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --fail --silent --show-error --output /tmp/restored-login \
            --header 'Content-Type: application/json' \
            --data '{"username":"admin","password":"Admin123!"}' \
            http://127.0.0.1:3000/api/auth/login
          node -e "const response = JSON.parse(require('fs').readFileSync('/tmp/restored-login', 'utf8')); if (!response.success || response.data.user.username !== 'admin') process.exit(1)"

      - name: Stop Compose stack
        if: always()
        run: docker compose --profile https down --volumes --remove-orphans
