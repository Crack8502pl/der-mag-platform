name: Database Setup Integration

on:
  pull_request:
    paths:
      - 'backend/src/config/database.ts'
      - 'backend/src/entities/**'
      - 'backend/src/migrations/**'
      - 'backend/src/services/DatabaseSeeder.ts'
      - 'backend/scripts/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/db-setup-integration.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/config/database.ts'
      - 'backend/src/entities/**'
      - 'backend/src/migrations/**'
      - 'backend/src/services/DatabaseSeeder.ts'
      - 'backend/scripts/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/db-setup-integration.yml'

jobs:
  setup-empty-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dermag_setup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dermag_setup_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: dermag_setup_test
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:setup
      - run: npm run db:setup
      - run: npm run db:verify-setup
